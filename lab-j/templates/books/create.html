{% extends "layout.html" %}
{% set body_class = "edit" %}

{% block content %}
<form class="edit-form" action="{{ url_for('books_create') }}" method="post">
    <div class="form-group">
        <label for="title">Tytuł</label>
        <input type="text" id="title" name="title" value="{{ book.get('title', '') }}" required>
    </div>
    <div class="form-group">
        <label for="author">Autor</label>
        <input type="text" id="author" name="author" value="{{ book.get('author', '') }}" required>
    </div>
    <div class="form-group">
        <label for="description">Opis</label>
        <textarea id="description" name="description" required>{{ book.get('description', '') }}</textarea>
    </div>
    <button type="submit">Dodaj</button>
    <a href="{{ url_for('books_index') }}">Anuluj</a>
</form>
{% endblock %}
