
App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  message: 'Miasto nie może być puste.'
                  groups: [new, edit]
            - Length:
                  min: 2
                  max: 100
                  minMessage: 'Nazwa miasta musi mieć co najmniej {{ limit }} znaki.'
                  maxMessage: 'Nazwa miasta może mieć maksymalnie {{ limit }} znaków.'
                  groups: [new, edit]
        country:
            - NotBlank:
                  message: 'Wybierz państwo.'
                  groups: [new, edit]
        latitude:
            - NotBlank:
                  message: 'Szerokość geograficzna nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Szerokość geograficzna musi być w zakresie od {{ min }} do {{ max }}.'
                  groups: [new, edit]
        longitude:
            - NotBlank:
                  message: 'Długość geograficzna nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Długość geograficzna musi być w zakresie od {{ min }} do {{ max }}.'
                  groups: [new, edit]


App\Entity\Measurement:
    properties:
        location:
            - NotNull:
                  message: 'Wybierz lokalizację.'
                  groups: [new, edit]

        date:
            - NotNull:
                  message: 'Data pomiaru nie może być pusta.'
                  groups: [new, edit]

        celsius:
            - NotBlank:
                  message: 'Temperatura nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -99
                  max: 99
                  notInRangeMessage: 'Temperatura musi być w zakresie od {{ min }} do {{ max }} °C.'
                  groups: [new, edit]
